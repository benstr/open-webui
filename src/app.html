<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/static/favicon.png" />
		<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
		<link rel="shortcut icon" href="/static/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Open WebUI" />

		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />
		<meta name="description" content="Open WebUI" />
		<link
			rel="search"
			type="application/opensearchdescription+xml"
			title="Open WebUI"
			href="/opensearch.xml"
		/>
		<script src="/static/loader.js" defer></script>

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				const updateFavicons = (theme) => {
					// Get the base URL
					const baseUrl = window.location.origin;
					
					// Only update favicons for hackster theme
					if (theme === 'hackster') {
						// Update favicon links
						document.querySelectorAll('link[rel="icon"]').forEach(link => {
							if (link.getAttribute('type') === 'image/png') {
								if (link.sizes && link.sizes.value === '96x96') {
									link.href = baseUrl + '/static/favicon-96x96-hackster-blue.png';
								} else {
									link.href = baseUrl + '/static/favicon-hackster-blue.png';
								}
							} else if (link.getAttribute('type') === 'image/svg+xml') {
								link.href = baseUrl + '/static/favicon-hackster-blue.png';
							}
						});
						document.querySelector('link[rel="shortcut icon"]').href = baseUrl + '/static/favicon-hackster-blue.png';
						document.querySelector('link[rel="apple-touch-icon"]').href = baseUrl + '/static/apple-touch-icon-hackster-blue.png';
					} else {
						// Restore original favicons
						document.querySelectorAll('link[rel="icon"][type="image/png"]').forEach((link) => {
							if (link.sizes && link.sizes.value === '96x96') {
								link.href = baseUrl + '/static/favicon-96x96.png';
							} else {
								link.href = baseUrl + '/static/favicon.png';
							}
						});
						document.querySelector('link[rel="icon"][type="image/svg+xml"]').href = baseUrl + '/static/favicon.svg';
						document.querySelector('link[rel="shortcut icon"]').href = baseUrl + '/static/favicon.ico';
						document.querySelector('link[rel="apple-touch-icon"]').href = baseUrl + '/static/apple-touch-icon.png';
					}
				};

				const updateTheme = (theme) => {
					updateFavicons(theme);
					
					// Get the base URL
					const baseUrl = window.location.origin;
					
					// Also update any images with alt="logo" or alt="profile" in the document
					const updateLogoImages = () => {
						// Handle all logo images
						document.querySelectorAll('img[alt="logo"]').forEach(img => {
							if (theme === 'hackster') {
								img.src = baseUrl + '/static/hackster-blue.png';
							} else if (img.src.includes('hackster-blue.png')) {
								// Check if we have a splash/logo image for this theme
								if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
									img.src = baseUrl + '/static/splash-dark.png';
								} else {
									img.src = baseUrl + '/static/splash.png';
								}
							}
						});
						
						// Handle profile images specifically
						document.querySelectorAll('img[alt="profile"]').forEach(img => {
							if (theme === 'hackster') {
								img.src = baseUrl + '/static/hackster-blue.png';
							}
						});

						// Set a short timeout to catch dynamically added images
						setTimeout(() => {
							document.querySelectorAll('img[alt="profile"]').forEach(img => {
								if (theme === 'hackster') {
									img.src = baseUrl + '/static/hackster-blue.png';
								}
							});
						}, 1000);
					};
					
					// Run immediately
					updateLogoImages();
					
					// Also run when DOM is fully loaded
					if (document.readyState === 'complete') {
						updateLogoImages();
					} else {
						window.addEventListener('load', updateLogoImages);
					}
					
					// Add a mutation observer to catch dynamically added images
					const observer = new MutationObserver(mutations => {
						mutations.forEach(mutation => {
							if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
								updateLogoImages();
							}
						});
					});
					
					// Start observing the document with the configured parameters
					observer.observe(document.body, { childList: true, subtree: true });
				};

				// Apply initial theme
				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
					updateTheme('system');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
					updateTheme('oled-dark');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
					updateTheme('light');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('dark');
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
					updateTheme('her');
				} else if (localStorage.theme === 'midnight-blue') {
					document.documentElement.style.setProperty('--color-gray-800', '#0f2e4e');
					document.documentElement.style.setProperty('--color-gray-850', '#0c2544');
					document.documentElement.style.setProperty('--color-gray-900', '#091d3a');
					document.documentElement.style.setProperty('--color-gray-950', '#061530');
					document.documentElement.classList.add('dark');
					document.documentElement.classList.add('midnight-blue');
					metaThemeColorTag.setAttribute('content', '#0f2e4e');
					updateTheme('midnight-blue');
				} else if (localStorage.theme === 'hackster') {
					// Hackster theme based on light theme
					document.documentElement.classList.add('light');
					document.documentElement.classList.add('hackster');
					metaThemeColorTag.setAttribute('content', '#ffffff');
					updateTheme('hackster');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
					updateTheme('dark');
				}

				// Add theme change listener to window object for other scripts to use
				window.setTheme = (newTheme) => {
					localStorage.theme = newTheme;
					updateTheme(newTheme);
				};

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
						updateTheme('system');
					}
				});

				function setSplashImage() {
					const logo = document.getElementById('logo');
					if (!logo) return;
					
					const isDarkMode = document.documentElement.classList.contains('dark');
					const isHackster = document.documentElement.classList.contains('hackster');
					const baseUrl = window.location.origin;

					if (isHackster) {
						logo.src = baseUrl + '/static/hackster-blue.png';
						logo.style.filter = '';
						return;
					}

					if (isDarkMode) {
						const darkImage = new Image();
						darkImage.src = baseUrl + '/static/splash-dark.png';

						darkImage.onload = () => {
							logo.src = baseUrl + '/static/splash-dark.png';
							logo.style.filter = ''; // Ensure no inversion is applied if splash-dark.png exists
						};

						darkImage.onerror = () => {
							logo.src = baseUrl + '/static/favicon.png'; // Use favicon as fallback
							logo.style.filter = 'invert(1)'; // Invert image if splash-dark.png is missing
						};
					} else {
						logo.src = baseUrl + '/static/splash.png';
					}
				}

				// Runs after classes are assigned
				window.onload = setSplashImage;
			})();
		</script>

		<title>Open WebUI</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<img
				id="logo"
				style="
					position: absolute;
					width: auto;
					height: 6rem;
					top: 44%;
					left: 50%;
					transform: translateX(-50%);
				"
				src="/static/splash.png"
				alt="logo"
			/>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="/static/splash.png"
					class="animate-pulse-fast"
					alt="logo"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>

			<!-- <span style="position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px">
				Footer content
			</span> -->
		</div>
	</body>
</html>

<style type="text/css" nonce="">
	html {
		overflow-y: hidden !important;
	}

	#splash-screen {
		background: #fff;
	}

	html.dark #splash-screen {
		background: #000;
	}

	html.her #splash-screen {
		background: #983724;
	}

	html.midnight-blue #splash-screen {
		background: #091d3a;
	}

	html.hackster #splash-screen {
		background: #fff;
	}

	#logo-her {
		display: none;
	}

	#progress-background {
		display: none;
	}

	#progress-bar {
		display: none;
	}

	html.her #logo {
		display: none;
	}

	html.her #logo-her {
		display: block;
	}

	html.her #progress-background {
		display: block;
	}

	html.her #progress-bar {
		display: block;
	}

	@media (max-width: 24rem) {
		html.her #progress-background {
			display: none;
		}

		html.her #progress-bar {
			display: none;
		}
	}

	@keyframes pulse {
		50% {
			opacity: 0.65;
		}
	}

	.animate-pulse-fast {
		animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
	}
</style>
